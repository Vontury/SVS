  spring:
  application:
    name: digital-hoarding-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by SQL migrations in /database (plan §58.13)
    open-in-view: false

server:
  port: ${SERVER_PORT:8083}

app:
  fastapi-base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
