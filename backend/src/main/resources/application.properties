spring.application.name=SVP
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hoarding}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hoarding}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by SQL migrations in /database (Phase 1). Hibernate must never change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
